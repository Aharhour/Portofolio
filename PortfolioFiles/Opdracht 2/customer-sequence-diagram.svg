<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1700" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .subtitle { font-size: 14px; fill: #555; }
      .actor-box { fill: #1a1a2e; stroke: #1a1a2e; stroke-width: 2; rx: 6; }
      .actor-text { fill: white; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .lifeline { stroke: #999; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .msg-line { stroke: #333; stroke-width: 1.5; }
      .msg-line-dash { stroke: #e74c3c; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .msg-text { font-size: 13px; fill: #222; }
      .section-divider { stroke: #ddd; stroke-width: 1; }
      .section-text { font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .arrow { fill: #333; }
      .arrow-red { fill: #e74c3c; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-red"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1700" fill="#fafbfc"/>

  <!-- Title -->
  <text x="550" y="40" class="title" text-anchor="middle">UML Sequence Diagram — Customer Side</text>
  <text x="550" y="62" class="subtitle" text-anchor="middle">BetaTickets — Simplified Customer Booking Flow</text>

  <!-- ========== ACTORS ========== -->
  <rect x="40" y="85" width="120" height="40" class="actor-box"/>
  <text x="100" y="110" class="actor-text">Customer</text>
  <line x1="100" y1="125" x2="100" y2="1620" class="lifeline"/>

  <rect x="260" y="85" width="140" height="40" class="actor-box"/>
  <text x="330" y="110" class="actor-text">React App</text>
  <line x1="330" y1="125" x2="330" y2="1620" class="lifeline"/>

  <rect x="500" y="85" width="160" height="40" class="actor-box"/>
  <text x="580" y="110" class="actor-text">Express API</text>
  <line x1="580" y1="125" x2="580" y2="1620" class="lifeline"/>

  <rect x="760" y="85" width="140" height="40" class="actor-box"/>
  <text x="830" y="110" class="actor-text">MongoDB</text>
  <line x1="830" y1="125" x2="830" y2="1620" class="lifeline"/>

  <rect x="970" y="85" width="100" height="40" class="actor-box"/>
  <text x="1020" y="110" class="actor-text">Stripe</text>
  <line x1="1020" y1="125" x2="1020" y2="1620" class="lifeline"/>

  <!-- ============================================================ -->
  <!-- 1. LOGIN -->
  <!-- ============================================================ -->
  <line x1="20" y1="155" x2="1080" y2="155" class="section-divider"/>
  <text x="30" y="178" class="section-text">1. Login</text>

  <line x1="100" y1="210" x2="325" y2="210" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="212" y="205" class="msg-text" text-anchor="middle">Click "Login"</text>

  <line x1="330" y1="245" x2="105" y2="245" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="212" y="240" class="msg-text" text-anchor="middle">Login form (Clerk) → JWT token</text>

  <!-- ============================================================ -->
  <!-- 2. BROWSE MOVIES -->
  <!-- ============================================================ -->
  <line x1="20" y1="280" x2="1080" y2="280" class="section-divider"/>
  <text x="30" y="303" class="section-text">2. Browse Movies</text>

  <line x1="100" y1="335" x2="325" y2="335" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="212" y="330" class="msg-text" text-anchor="middle">Open home page</text>

  <line x1="330" y1="370" x2="575" y2="370" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="452" y="365" class="msg-text" text-anchor="middle">GET /api/show/all</text>

  <line x1="580" y1="400" x2="825" y2="400" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="702" y="395" class="msg-text" text-anchor="middle">find all shows</text>

  <line x1="830" y1="430" x2="585" y2="430" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="707" y="425" class="msg-text" text-anchor="middle">movies + showtimes</text>

  <line x1="580" y1="460" x2="335" y2="460" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="457" y="455" class="msg-text" text-anchor="middle">JSON response</text>

  <line x1="330" y1="490" x2="105" y2="490" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="212" y="485" class="msg-text" text-anchor="middle">Show movie list</text>

  <!-- ============================================================ -->
  <!-- 3. MOVIE DETAILS -->
  <!-- ============================================================ -->
  <line x1="20" y1="525" x2="1080" y2="525" class="section-divider"/>
  <text x="30" y="548" class="section-text">3. View Movie &amp; Pick Date</text>

  <line x1="100" y1="580" x2="325" y2="580" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="212" y="575" class="msg-text" text-anchor="middle">Click a movie</text>

  <line x1="330" y1="615" x2="575" y2="615" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="452" y="610" class="msg-text" text-anchor="middle">GET /api/show/:movieId</text>

  <line x1="580" y1="645" x2="825" y2="645" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="702" y="640" class="msg-text" text-anchor="middle">find movie + showtimes</text>

  <line x1="830" y1="675" x2="105" y2="675" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="467" y="670" class="msg-text" text-anchor="middle">Movie details + dates shown to customer</text>

  <line x1="100" y1="710" x2="325" y2="710" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="212" y="705" class="msg-text" text-anchor="middle">Pick date + click "Book Now"</text>

  <!-- ============================================================ -->
  <!-- 4. SEAT SELECTION -->
  <!-- ============================================================ -->
  <line x1="20" y1="745" x2="1080" y2="745" class="section-divider"/>
  <text x="30" y="768" class="section-text">4. Choose Seats</text>

  <line x1="330" y1="805" x2="575" y2="805" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="452" y="800" class="msg-text" text-anchor="middle">GET /api/booking/seats/:showId</text>

  <line x1="580" y1="840" x2="825" y2="840" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="702" y="835" class="msg-text" text-anchor="middle">get occupied seats</text>

  <line x1="830" y1="870" x2="585" y2="870" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="707" y="865" class="msg-text" text-anchor="middle">list of taken seats</text>

  <line x1="580" y1="900" x2="105" y2="900" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="340" y="895" class="msg-text" text-anchor="middle">Seat grid with occupied seats greyed out</text>

  <line x1="100" y1="935" x2="325" y2="935" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="212" y="930" class="msg-text" text-anchor="middle">Click seats + "Proceed"</text>

  <!-- ============================================================ -->
  <!-- 5. BOOKING + PAYMENT -->
  <!-- ============================================================ -->
  <line x1="20" y1="970" x2="1080" y2="970" class="section-divider"/>
  <text x="30" y="993" class="section-text">5. Create Booking &amp; Pay</text>

  <line x1="330" y1="1030" x2="575" y2="1030" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="452" y="1025" class="msg-text" text-anchor="middle">POST /api/booking/create</text>

  <line x1="580" y1="1060" x2="825" y2="1060" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="702" y="1055" class="msg-text" text-anchor="middle">save booking (isPaid = false)</text>

  <line x1="580" y1="1095" x2="1015" y2="1095" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="797" y="1090" class="msg-text" text-anchor="middle">create Stripe checkout session</text>

  <line x1="1020" y1="1125" x2="585" y2="1125" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="797" y="1120" class="msg-text" text-anchor="middle">payment URL</text>

  <line x1="580" y1="1155" x2="105" y2="1155" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="340" y="1150" class="msg-text" text-anchor="middle">Redirect customer to Stripe</text>

  <line x1="100" y1="1190" x2="1015" y2="1190" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="555" y="1185" class="msg-text" text-anchor="middle">Enter card details &amp; pay</text>

  <!-- ============================================================ -->
  <!-- 6. PAYMENT CONFIRMATION -->
  <!-- ============================================================ -->
  <line x1="20" y1="1225" x2="1080" y2="1225" class="section-divider"/>
  <text x="30" y="1248" class="section-text">6. Payment Confirmation (Webhook)</text>

  <line x1="1020" y1="1285" x2="585" y2="1285" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="797" y="1280" class="msg-text" text-anchor="middle">Stripe webhook: payment succeeded</text>

  <line x1="580" y1="1320" x2="825" y2="1320" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="702" y="1315" class="msg-text" text-anchor="middle">update booking → isPaid = true</text>

  <!-- ============================================================ -->
  <!-- 7. MY BOOKINGS -->
  <!-- ============================================================ -->
  <line x1="20" y1="1360" x2="1080" y2="1360" class="section-divider"/>
  <text x="30" y="1383" class="section-text">7. View My Bookings</text>

  <line x1="100" y1="1420" x2="325" y2="1420" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="212" y="1415" class="msg-text" text-anchor="middle">Open /my-bookings</text>

  <line x1="330" y1="1455" x2="575" y2="1455" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="452" y="1450" class="msg-text" text-anchor="middle">GET /api/user/bookings</text>

  <line x1="580" y1="1485" x2="825" y2="1485" class="msg-line" marker-end="url(#arrowhead)"/>
  <text x="702" y="1480" class="msg-text" text-anchor="middle">find user's bookings</text>

  <line x1="830" y1="1515" x2="585" y2="1515" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="707" y="1510" class="msg-text" text-anchor="middle">bookings list</text>

  <line x1="580" y1="1545" x2="105" y2="1545" class="msg-line-dash" marker-end="url(#arrowhead-red)"/>
  <text x="340" y="1540" class="msg-text" text-anchor="middle">Show bookings (movie, date, seats, status)</text>

  <!-- ========== BOTTOM ACTOR BOXES ========== -->
  <rect x="40" y="1635" width="120" height="30" class="actor-box"/>
  <text x="100" y="1655" class="actor-text">Customer</text>

  <rect x="260" y="1635" width="140" height="30" class="actor-box"/>
  <text x="330" y="1655" class="actor-text">React App</text>

  <rect x="500" y="1635" width="160" height="30" class="actor-box"/>
  <text x="580" y="1655" class="actor-text">Express API</text>

  <rect x="760" y="1635" width="140" height="30" class="actor-box"/>
  <text x="830" y="1655" class="actor-text">MongoDB</text>

  <rect x="970" y="1635" width="100" height="30" class="actor-box"/>
  <text x="1020" y="1655" class="actor-text">Stripe</text>
</svg>
